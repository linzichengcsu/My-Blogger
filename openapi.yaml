openapi: 3.0.1
info:
  title: 个人博客系统 API 文档
  description: 基于 Spring Boot 3.2.5 构建的个人博客系统 RESTful API
  contact:
    name: 林子诚
    email: 941435991@qq.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - name: 文件管理
    description: 文件上传、下载、删除及Base64转换接口
  - name: Admin
    description: 管理员接口
  - name: 用户管理
    description: 用户认证及信息管理
  - name: 文章管理
    description: 文章CRUD及发布归档操作
  - name: 分类管理
    description: 分类CRUD及父子类关系相关接口
  - name: Actuator
    description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
  - name: 评论管理
    description: 评论CRUD及回复操作
paths:
  /api/users/{userId}:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      description: 通过用户ID获取用户详情
      operationId: getUserDetail
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
    put:
      tags:
        - 用户管理
      summary: 更新用户信息
      description: 通过用户ID更新用户信息
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
    delete:
      tags:
        - 用户管理
      summary: 删除用户
      description: 通过用户ID删除用户
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: softDelete
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/me:
    get:
      tags:
        - 用户管理
      summary: 获取当前登录用户个人信息
      description: 仅凭Token，无需手动传入用户ID
      operationId: getMyInfo
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
    put:
      tags:
        - 用户管理
      summary: 修改当前登录用户个人信息
      description: 仅凭Token，无需手动传入用户ID
      operationId: updateMyInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
  /api/categories/{categoryId}:
    get:
      tags:
        - 分类管理
      summary: 获取分类详情
      description: 获取指定ID的分类详情
      operationId: getCategoryById
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultCategoryDTO'
    put:
      tags:
        - 分类管理
      summary: 更新分类
      description: 更新指定ID的分类
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultCategoryDTO'
    delete:
      tags:
        - 分类管理
      summary: 删除分类
      description: 删除指定ID的分类
      operationId: deleteCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/articles/{articleId}:
    get:
      tags:
        - 文章管理
      summary: 获取文章详情
      description: 公开访问
      operationId: getArticleById
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultArticleDetailDTO'
    put:
      tags:
        - 文章管理
      summary: 更新文章
      description: 需要登录且为文章作者或管理员
      operationId: updateArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultArticleDetailDTO'
    delete:
      tags:
        - 文章管理
      summary: 删除文章
      description: 需要登录且为文章作者或管理员
      operationId: deleteArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/{userId}/unlock:
    post:
      tags:
        - 用户管理
      summary: 解锁用户
      description: 通过用户ID解锁用户
      operationId: unlockUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/{userId}/lock:
    post:
      tags:
        - 用户管理
      summary: 锁定用户
      description: 通过用户ID锁定用户
      operationId: lockUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/{userId}/deactivate:
    post:
      tags:
        - 用户管理
      summary: 禁用用户
      description: 通过用户ID禁用用户
      operationId: deactivateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/{userId}/change-password:
    post:
      tags:
        - 用户管理
      summary: 修改密码
      description: 通过用户ID修改密码
      operationId: changePassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/{userId}/activate:
    post:
      tags:
        - 用户管理
      summary: 启用用户
      description: 通过用户ID启用用户
      operationId: activateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/register:
    post:
      tags:
        - 用户管理
      summary: 用户注册或创建
      description: 前端仅限普通用户，管理员须由Apifox创建
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
  /api/users/refresh:
    post:
      tags:
        - 用户管理
      summary: 刷新Token
      description: 返回新的Token
      operationId: refreshToken
      parameters:
        - name: refreshToken
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultLoginResponseDTO'
  /api/users/me/change-password:
    post:
      tags:
        - 用户管理
      summary: 修改密码
      description: 仅凭Token，无需手动传入用户ID
      operationId: changeMyPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordChangeRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/users/login:
    post:
      tags:
        - 用户管理
      summary: 用户登录
      description: 返回Token
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultLoginResponseDTO'
  /api/files/upload:
    post:
      tags:
        - 文件管理
      summary: 上传文件
      description: 上传图片文件到服务器（需要登录）
      operationId: uploadFile
      requestBody:
        content:
          application/json:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: 要上传的文件
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileUploadResponse'
  /api/files/upload-base64:
    post:
      tags:
        - 文件管理
      summary: Base64文件上传
      description: 接收Base64编码数据并保存为文件（需要登录）
      operationId: uploadBase64File
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Base64UploadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultFileUploadResponse'
  /api/comments/batch/delete:
    post:
      tags:
        - 评论管理
      summary: 批量删除评论
      description: 需要管理员权限
      operationId: batchDeleteComments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInteger'
  /api/comments/batch/approve:
    post:
      tags:
        - 评论管理
      summary: 批量审核评论
      description: 需要管理员权限
      operationId: batchApproveComments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBatchApprovalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInteger'
  /api/comments/article/{articleId}:
    get:
      tags:
        - 评论管理
      summary: 获取文章评论列表
      description: 公开访问
      operationId: getTopLevelComments
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultPageResponseDTOCommentDTO'
    post:
      tags:
        - 评论管理
      summary: 创建评论
      description: 需要登录，自动使用当前用户作为评论者
      operationId: createComment
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultCommentDTO'
  /api/categories:
    get:
      tags:
        - 分类管理
      summary: 获取所有分类
      description: 获取所有分类列表，分页显示
      operationId: getAllCategories
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultPageResponseDTOCategoryDTO'
    post:
      tags:
        - 分类管理
      summary: 创建分类
      description: 创建一个新的分类
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultCategoryDTO'
  /api/articles:
    get:
      tags:
        - 文章管理
      summary: 获取文章列表
      description: 公开访问，支持分页
      operationId: getArticleList
      parameters:
        - name: pageRequest
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageRequestDTO'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultPageResponseDTOArticleListItemDTO'
    post:
      tags:
        - 文章管理
      summary: 创建文章
      description: 需要登录，自动使用当前用户作为作者
      operationId: createArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultArticleDetailDTO'
  /api/articles/{articleId}/view:
    post:
      tags:
        - 文章管理
      summary: 浏览文章
      description: 公开访问，记录浏览数
      operationId: viewArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/articles/{articleId}/publish:
    post:
      tags:
        - 文章管理
      summary: 发布文章
      description: 需要登录且为文章作者或管理员
      operationId: publishArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultArticleDetailDTO'
  /api/articles/{articleId}/like:
    post:
      tags:
        - 文章管理
      summary: 点赞文章
      description: 需要登录
      operationId: likeArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /api/articles/{articleId}/archive:
    post:
      tags:
        - 文章管理
      summary: 归档文章
      description: 需要登录且为文章作者或管理员
      operationId: archiveArticle
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultArticleDetailDTO'
  /api/articles/batch/publish:
    post:
      tags:
        - 文章管理
      summary: 批量发布文章
      description: 需要管理员权限
      operationId: batchPublishArticles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInteger'
  /api/articles/batch/delete:
    post:
      tags:
        - 文章管理
      summary: 批量删除文章
      description: 需要管理员权限
      operationId: batchDeleteArticles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInteger'
  /api/articles/batch/archive:
    post:
      tags:
        - 文章管理
      summary: 批量归档文章
      description: 需要管理员权限
      operationId: batchArchiveArticles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultInteger'
  /api/users:
    get:
      tags:
        - 用户管理
      summary: 获取所有用户
      description: 分页获取所有用户
      operationId: getAllUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultPageResponseDTOUserProfileDTO'
  /api/users/{userId}/profile:
    get:
      tags:
        - 用户管理
      summary: 获取用户公开资料
      description: 通过用户ID获取用户公开资料
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserProfileDTO'
  /api/users/{userId}/activity:
    get:
      tags:
        - 用户管理
      summary: 获取用户活动统计
      description: 通过用户ID获取用户活动统计
      operationId: getUserActivity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserActivityDTO'
  /api/users/username/{username}:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      description: 通过用户名获取用户详情
      operationId: getUserDetailByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultUserDetailDTO'
  /api/users/stats/total:
    get:
      tags:
        - 用户管理
      summary: 获取总用户数
      description: 获取系统的总用户数
      operationId: getTotalUserCount
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultLong'
  /api/users/stats/recently-active:
    get:
      tags:
        - 用户管理
      summary: 获取最近活跃用户列表
      description: 获取最近活跃的用户列表
      operationId: getRecentlyActiveUsers
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultListUserActivityDTO'
  /api/users/stats/active:
    get:
      tags:
        - 用户管理
      summary: 获取活跃用户数
      description: 获取当前活跃的用户数
      operationId: countActiveUsers
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultLong'
  /api/users/search:
    get:
      tags:
        - 用户管理
      summary: 搜索用户
      description: 通过关键词搜索用户
      operationId: searchUsers
      parameters:
        - name: keyword
          in: query
