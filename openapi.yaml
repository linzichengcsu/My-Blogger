components:
  schemas:
    UserUpdateRequest:
      type: object
      properties:
        displayName:
          maxLength: 50
          minLength: 0
          type: string
        bio:
          maxLength: 200
          minLength: 0
          type: string
        avatar:
          type: string
    ResultUserDetailDTO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserDetailDTO'
        message:
          type: string
        code:
          type: integer
          format: int32
    UserDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        bio:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - SUPER_ADMIN
        lastLoginAt:
          type: string
          format: date-time
        articleCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
        favoriteCount:
          type: integer
          format: int64
    CategoryRequest:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 20
          minLength: 2
          type: string
        description:
          type: string
    CategoryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
        articleCount:
          type: integer
          format: int32
    ResultCategoryDTO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CategoryDTO'
        message:
          type: string
        code:
          type: integer
          format: int32
    ArticleUpdateRequest:
      type: object
      properties:
        title:
          maxLength: 100
          minLength: 5
          type: string
        content:
          maxLength: 2147483647
          minLength: 20
          type: string
        summary:
          maxLength: 200
          minLength: 0
          type: string
        coverImage:
          type: string
        categoryIds:
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int64
        status:
          type: string
          enum:
            - DRAFT
            - RELEASE
            - ARCHIVE
        tags:
          type: array
          items:
            type: string
    ArticleDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        coverImage:
          type: string
        author:
          $ref: '#/components/schemas/UserProfileDTO'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDTO'
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - DRAFT
            - RELEASE
            - ARCHIVE
        likeCount:
          type: integer
          format: int32
        favoriteCount:
          type: integer
          format: int32
        commentCount:
          type: integer
          format: int32
        isLiked:
          type: boolean
        isFavorite:
          type: boolean
    ResultArticleDetailDTO:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ArticleDetailDTO'
        message:
          type: string
        code:
          type: integer
          format: int32
    UserProfileDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        bio:
          type: string
        createdAt:
          type: string
          format: date-time
        articleCount:
          type: integer
          format: int64
        commentCount:
          type: integer
          format: int64
        followerCount:
          type: integer
          format: int64
