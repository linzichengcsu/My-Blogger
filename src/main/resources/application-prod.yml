spring:
  datasource:
    connection-fetch: lazy
    url: jdbc:mysql://localhost:3306/csulzc_blogdb_prod?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=utf8&requireSSL=true&connectTimeout=5000&socketTimeout=30000
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME_PROD}
    password: ${DB_PASSWORD_PROD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: BlogHikariCP
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true       # 对已有数据库建立基线，避免首次运行报错
    baseline-version: 0             # 基线版本号，表示已存在的表属于此版本之前
    out-of-order: false             # 禁止乱序执行（生产环境必须为 false）
    validate-on-migrate: true       # 迁移前校
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3s
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 3s
    socket-timeout: 10s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
          time_zone: UTC
        order_inserts: true
        order_updates: true
        generate_statistics: false
        default_batch_fetch_size: 20
  thymeleaf:
    check-template-location: false   # 无 templates 目录，避免启动告警（与 dev 保持一致）

app:
  cache:
    enabled: true
  search:
    elasticsearch:
      enabled: true
      auto-create-index: true
      # 首次部署或数据修复时临时改为 true 触发全量重建，完成后改回 false
      reindex-on-startup: false
      index-name: articles
      reindex-batch-size: 500

jwt:
  secret: ${JWT_SECRET_PROD}
  expiration: 3600000
  refresh-expiration: 86400000
  token-prefix: "Bearer "
  header: Authorization

file:
  upload-dir: /var/www/uploads
  max-file-size: 5242880
  allowed-file-types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp

# 生产环境关闭 API 文档端点（SecurityConfig 中 swagger 放行与此联动）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
    csulzc.My_Personal_Blogger: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/blog/application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: never
    info:
      enabled: true
    metrics:
      enabled: false
    prometheus:
      enabled: false

server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json,application/javascript
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192
    accesslog:
      enabled: true
      directory: /var/log/blog
      prefix: access_log
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
