spring:
  datasource:
    url: jdbc:mysql://localhost:3306/csulzc_blogdb_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME_DEV}
    password: ${DB_PASSWORD_DEV}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: true
  thymeleaf:
    check-template-location: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
      enabled: true
  security:
    user:
      password: disabled
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 10s

app:
  cache:
    enabled: false
  search:
    elasticsearch:
      enabled: true
      auto-create-index: true
      reindex-on-startup: false
      index-name: articles
      reindex-batch-size: 500

jwt:
  secret: ${JWT_SECRET:my-personal-blog-secret-key-2026-must-be-changed-in-production-environment}
  expiration: 86400000
  refresh-expiration: 604800000
  token-prefix: "Bearer "
  header: Authorization

file:
  upload-dir: uploads
  max-file-size: 5242880
  allowed-file-types:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  show-actuator: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
    csulzc.My_Personal_Blogger: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  health:
    redis:
      enabled: false