# src/test/resources/application-test.properties
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

jwt.secret=test-secret-key-for-jwt-token-generation-must-be-32-chars
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.token-prefix=Bearer 
jwt.header=Authorization

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# 高并发压测时所有线程更新同一行，H2 默认 1000ms 锁超时会让队尾线程抛 LockTimeoutException
# （表现为 success 数 < threads，而非真的丢更新）。将会话锁超时提到 60s，与 harness 的
# AWAIT_TIMEOUT_MS 对齐，让线程排队等待而不是 1s 即放弃，从而支持更高 -Scale 压力。
spring.datasource.hikari.connection-init-sql=SET LOCK_TIMEOUT 60000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# 与生产保持一致：Instant 字段以 UTC 读写时间列，确保测试断言与生产行为一致
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

spring.main.allow-bean-definition-overriding=true

spring.flyway.enabled=false

management.health.redis.enabled=false
# 测试环境无 ES，禁用 ES 健康指示器，避免 actuator/health 变为 DOWN
management.health.elasticsearch.enabled=false

app.cache.enabled=false

# 测试环境不启用 Redis 计数与定时落库，点赞/浏览自动走数据库同步降级路径
app.article-stat.enabled=false

# 测试环境不启用 Elasticsearch（搜索自动降级为 JPA LIKE，无需本地 ES）
app.search.elasticsearch.enabled=false

# 测试环境无 Redis，关闭 JWT 黑名单/封禁主动失效检查（直接放行，不触碰 Redis）
app.jwt-blacklist.enabled=false

