# ============================================================
# 压测环境专用 Compose（与 deploy/docker-compose.yml 生产栈完全隔离）
#
# 隔离手段：
#   - 独立 project name：blog-loadtest（容器/网络/卷均不与生产栈共享）
#   - 独立数据库：csulzc_blogdb_loadtest
#   - 独立卷：lt-*
#   - 端口只绑定 127.0.0.1 且使用非默认端口（13306 / 16379 / 19200），
#     避免与宿主机上 dev 用的 MySQL(3306) / Redis(6379) 冲突
#
# 两种用法：
#   A. 仅中间件（推荐：应用跑宿主机，便于 async-profiler / JFR 剖析）
#      docker compose -f deploy/docker-compose.loadtest.yml up -d
#      mvn spring-boot:run -Dspring-boot.run.profiles=loadtest
#
#   B. 整个栈（更接近生产形态）
#      docker compose -f deploy/docker-compose.loadtest.yml --profile app up -d
# ============================================================
name: blog-loadtest

services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 压测追求稳定复现，关闭 binlog 减少写放大带来的噪声
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${LT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: csulzc_blogdb_loadtest
      MYSQL_USER: ${LT_MYSQL_USER}
      MYSQL_PASSWORD: ${LT_MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:13306:3306"     # 供宿主机应用与观测工具连接
    volumes:
      - lt-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ltnet]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      LT_REDIS_PASSWORD: ${LT_REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${LT_REDIS_PASSWORD}
      --appendonly no
      --save ""
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:16379:6379"     # 供宿主机应用与 redis-cli 连接
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$LT_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ltnet]

  es:
    build:
      context: ./es
    image: blog-elasticsearch:9.4.5-ik
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:19200:9200"     # 供宿主机应用与检索调试连接
    volumes:
      - lt-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=20s'"]
      interval: 10s
      timeout: 25s
      retries: 20
    networks: [ltnet]

  # 仅在使用「用法 B（整栈容器化）」时启动：--profile app
  blog:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: blog-backend:loadtest
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      es:    { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      # 容器内直接走服务名，覆盖 loadtest profile 中面向宿主机写的 127.0.0.1:13306 等默认值
      LOADTEST_DB_HOST: mysql
      LOADTEST_DB_PORT: "3306"
      LOADTEST_DB_USERNAME: ${LT_MYSQL_USER}
      LOADTEST_DB_PASSWORD: ${LT_MYSQL_PASSWORD}
      LOADTEST_REDIS_HOST: redis
      LOADTEST_REDIS_PORT: "6379"
      LOADTEST_REDIS_PASSWORD: ${LT_REDIS_PASSWORD}
      LOADTEST_ES_URIS: http://es:9200
      LOADTEST_JWT_SECRET: ${LT_JWT_SECRET}
      LOADTEST_REINDEX_ON_STARTUP: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s            # 留给 Flyway 迁移 + 种子灌入 + ES 全量重建
    networks: [ltnet]

volumes:
  lt-mysqldata:
  lt-esdata:

networks:
  ltnet:
    driver: bridge
