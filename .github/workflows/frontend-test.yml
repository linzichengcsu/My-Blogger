# 前端 CI：TypeScript 类型检查 + Vitest 单元测试 + Vite 生产构建
#
# 说明：
# - 前端使用 npm（见 frontend/package-lock.json，lockfileVersion 3）。
# - 单元测试使用 Vitest + Testing Library（jsdom 环境）。
name: Frontend Tests

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"

jobs:
  frontend-test:
    name: Typecheck, Unit Test & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Test
        run: npm run test:run

      - name: Build
        run: npm run build
