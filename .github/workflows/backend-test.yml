# 后端 CI：基于 git diff 的增量测试（必要时回退全量）
#
# 增量策略：
# - 通过 git diff 获取相对于 PR base 或 push 前的变更文件列表
# - 将变更的生产代码文件映射为对应的测试类（ArticleService.java → ArticleServiceTest）
# - 仅执行被映射到的测试类，避免每次改动只跑全量
#
# 以下情况自动回退全量测试（无法安全增量）：
# - pom.xml / mvnw / .mvn / src/main/resources 变更
# - config/ aspect/ api/dto/ api/response 目录下文件变更
# - 无对应测试类的生产类变更（BaseEntity、ArticleListAssembler、loadtest 等）
# - security/JwtAuthenticationFilter、search 目录除 ArticleSearchService 外的文件变更
# - push 事件的 before SHA 为全零（首次 push 无法比较）
#
# 说明：
# - 测试使用 test Profile（H2 内存库，见 src/test/resources/application-test.properties），
#   已禁用 Redis / Flyway，因此无需在 CI 中启动 MySQL / Redis 服务。
# - Java 版本与 pom.xml 中 <java.version>21</java.version> 保持一致。
name: Backend Tests

on:
  push:
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/backend-test.yml"

jobs:
  backend-test:
    name: Maven Test (JDK 21)
    runs-on: ubuntu-latest
    outputs:
      fallback_full: ${{ steps.detect.outputs.fallback_full }}
      test_classes: ${{ steps.detect.outputs.test_classes }}
      skip_test: ${{ steps.detect.outputs.skip_test }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        shell: bash
        run: chmod +x mvnw

      # ── 增量测试检测 ──────────────────────────────────────────────
      - name: Detect changed tests
        id: detect
        shell: bash
        run: |
          set -e

          # ── 1. 确定 diff 基线 ──
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            DIFF_OPTS="...HEAD"  # PR 用三点（基于 merge-base）
          else
            BASE_SHA="${{ github.event.before }}"
            # push 到空仓库时 before 为全零，此时回退全量
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "fallback_full=true" >> "$GITHUB_OUTPUT"
              echo "test_classes=" >> "$GITHUB_OUTPUT"
              echo "skip_test=false" >> "$GITHUB_OUTPUT"
              echo "::warning::First push detected — cannot diff, falling back to full suite"
              exit 0
            fi
            DIFF_OPTS="..HEAD"    # push 用两点（线性历史直接比）
          fi

          # ── 2. 获取变更文件列表 ──
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA$DIFF_OPTS" 2>/dev/null || true)
          echo "=== Changed files ==="
          echo "$CHANGED_FILES"
          echo "====================="

          # diff 失败（例如 force-push 导致 SHA 不可达）→ 回退全量
          if [ -z "$CHANGED_FILES" ]; then
            echo "fallback_full=true" >> "$GITHUB_OUTPUT"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            echo "skip_test=false" >> "$GITHUB_OUTPUT"
            echo "::warning::git diff returned no files — falling back to full suite"
            exit 0
          fi

          # ── 3. 判断是否需要回退全量 ──
          FALLBACK=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # 构建 / 依赖 / 资源变更 → 回退
            if [[ "$file" == "pom.xml" || "$file" == "mvnw" \
                  || "$file" == .mvn/* \
                  || "$file" == src/main/resources/* ]]; then
              FALLBACK=true
            fi

            # 配置 / 切面 / DTO / 全局响应 → 回退（全局影响）
            if [[ "$file" =~ ^src/main/java/.*/config/.*\.java$ \
                  || "$file" =~ ^src/main/java/.*/aspect/.*\.java$ \
                  || "$file" =~ ^src/main/java/.*/api/dto/.*\.java$ \
                  || "$file" =~ ^src/main/java/.*/api/response/.*\.java$ ]]; then
              FALLBACK=true
            fi

            # 无对应测试的基类 / 特殊类 → 回退
            case "$file" in
              */BaseEntity.java) FALLBACK=true ;;
              */ArticleListAssembler.java) FALLBACK=true ;;
              */MyPersonalBloggerApplication.java) FALLBACK=true ;;
              */ArticleLike.java) FALLBACK=true ;;
              */Admin.java) FALLBACK=true ;;
              */ArticleLikeRepository.java) FALLBACK=true ;;
              */BaseRepository.java) FALLBACK=true ;;
            esac

            # security 目录除 JwtTokenProvider 外（JwtTokenProvider 有独立测试）
            if [[ "$file" =~ ^src/main/java/.*/security/.*\.java$ \
                  && "$file" != */JwtTokenProvider.java ]]; then
              FALLBACK=true
            fi

            # search 目录除 ArticleSearchService 外（ES 索引相关类无测试）
            if [[ "$file" =~ ^src/main/java/.*/search/.*\.java$ \
                  && "$file" != */ArticleSearchService.java ]]; then
              FALLBACK=true
            fi

            # loadtest 目录（无测试）
            if [[ "$file" =~ ^src/main/java/.*/loadtest/.*\.java$ ]]; then
              FALLBACK=true
            fi

          done <<< "$CHANGED_FILES"

          if $FALLBACK; then
            echo "fallback_full=true" >> "$GITHUB_OUTPUT"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            echo "skip_test=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Changes detected in config/aspect/dto/resources or untestable files — falling back to full suite"
            exit 0
          fi

          # ── 4. 映射变更文件 → 测试类 ──
          TEST_CLASSES=""
          MAP_TMP=$(mktemp)
          HAS_CONTROLLER_CHANGE=false
          HAS_ENTITY_CHANGE=false

          # 4a. 生产代码 .java → 推断测试类名
          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # 只处理 src/main/java 下的 .java 文件
            [[ ! "$file" =~ ^src/main/java/.+\.java$ ]] && continue

            BASENAME=$(basename "$file" .java)

            # service 目录 → *ServiceTest / *SchedulerTest / *AssemblerTest
            if [[ "$file" =~ ^src/main/java/.*/service/ ]]; then
              echo "${BASENAME}Test" >> "$MAP_TMP"

            # controller 目录 → *ControllerTest + 标记需要跑集成测试
            elif [[ "$file" =~ ^src/main/java/.*/controller/ ]]; then
              echo "${BASENAME}Test" >> "$MAP_TMP"
              HAS_CONTROLLER_CHANGE=true

            # repository 目录 → *RepositoryTest
            elif [[ "$file" =~ ^src/main/java/.*/repository/ ]]; then
              echo "${BASENAME}Test" >> "$MAP_TMP"

            # domain/entity 目录 → *EntityTest + 标记需要跑实体关系测试
            elif [[ "$file" =~ ^src/main/java/.*/domain/entity/ ]]; then
              echo "${BASENAME}EntityTest" >> "$MAP_TMP"
              HAS_ENTITY_CHANGE=true

            # security/JwtTokenProvider（有独立测试）
            elif [[ "$file" == */security/JwtTokenProvider.java ]]; then
              echo "JwtTokenProviderTest" >> "$MAP_TMP"

            # search/ArticleSearchService（有独立测试）
            elif [[ "$file" == */search/ArticleSearchService.java ]]; then
              echo "ArticleSearchServiceTest" >> "$MAP_TMP"
            fi
          done <<< "$CHANGED_FILES"

          # 4b. controller 变更 → 追加 ApiIntegrationTest（跨 controller 集成）
          if $HAS_CONTROLLER_CHANGE; then
            echo "ApiIntegrationTest" >> "$MAP_TMP"
          fi
          # 4c. entity 变更 → 追加 EntityRelationTest（跨实体关系）
          if $HAS_ENTITY_CHANGE; then
            echo "EntityRelationTest" >> "$MAP_TMP"
          fi

          # 4d. 测试文件本身变更 → 直接加入测试类列表
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [[ ! "$file" =~ ^src/test/java/.+\.java$ ]] && continue
            # 从路径中提取类名（不含 .java）
            BASENAME=$(basename "$file" .java)
            echo "$BASENAME" >> "$MAP_TMP"
          done <<< "$CHANGED_FILES"

          # ── 5. 汇总 ──
          if [ -s "$MAP_TMP" ]; then
            TEST_CLASSES=$(sort -u "$MAP_TMP" | tr '\n' ',' | sed 's/,$//')
          fi
          rm -f "$MAP_TMP"

          if [ -z "$TEST_CLASSES" ]; then
            # 没有映射到任何测试类（可能只改了非 Java 文件）→ 回退全量
            echo "fallback_full=true" >> "$GITHUB_OUTPUT"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            echo "skip_test=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No test classes could be mapped from changes — falling back to full suite"
          else
            echo "fallback_full=false" >> "$GITHUB_OUTPUT"
            echo "test_classes=$TEST_CLASSES" >> "$GITHUB_OUTPUT"
            echo "skip_test=false" >> "$GITHUB_OUTPUT"
            echo "::info::Incremental test classes ($(echo "$TEST_CLASSES" | tr ',' '\n' | wc -l) classes): $TEST_CLASSES"
          fi

      # ── 执行测试 ──
      - name: Run tests (incremental)
        if: steps.detect.outputs.fallback_full == 'false' && steps.detect.outputs.skip_test == 'false'
        shell: bash
        run: |
          ./mvnw -B -ntp test \
            "-Dtest=${{ steps.detect.outputs.test_classes }},!MySQLConnectionTest" \
            -DfailIfNoTests=false

      - name: Run tests (full fallback)
        if: steps.detect.outputs.fallback_full == 'true' && steps.detect.outputs.skip_test == 'false'
        shell: bash
        run: |
          echo "::warning::Running full test suite as fallback"
          ./mvnw -B -ntp test "-Dtest=!MySQLConnectionTest"

      - name: Skip tests
        if: steps.detect.outputs.skip_test == 'true'
        shell: bash
        run: echo "::info::No relevant changes — tests skipped"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore
