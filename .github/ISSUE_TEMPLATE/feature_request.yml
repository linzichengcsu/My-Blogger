name: ✨ 功能请求
description: 提出一个新功能或改进建议
labels: [enhancement]
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        > **填写说明**：功能请求需要说明「为什么」和「怎么做」，参考 [Product Principles](https://github.com/linzichengcsu/My-Personal-Blogger/blob/main/docs/PRODUCT_PRINCIPLES.md)。

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 这个功能的痛点/场景是什么？为什么现有方案不够好？
      placeholder: |
        - 我想在博客发布后自动同步到微博/CSDN
        - 现有方案需要手动复制粘贴，效率很低
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 简单描述你希望的交互/API 设计
      placeholder: |
        - 在文章编辑器底部加一个「一键同步」按钮
        - 点击后弹出 OAuth 授权弹窗
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 后端 API
        - 前端 UI / UX
        - 数据库 Schema
        - 权限 / 角色体系
        - 性能优化
        - 管理员后台
        - 文档 / 测试

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 有没有考虑过其他实现方式？为什么放弃了？

  - type: textarea
    id: references
    attributes:
      label: 参考资料（可选）
      description: 相关的 Issue、PR、设计文档、竞品链接等
